# 会员录音（日语 VOICEVOX、中文 MeloTTS、英语 Kokoro）：在这个公开仓库里跑，不占私有主仓库的 GitHub Actions 免费额度。
# 脚本和文字从私有仓库 koshokai/nihonggo-dojo 取（MAIN_REPO_TOKEN，只读）；会员内容从服务器（Supabase）读，录音上传到 Supabase 的私有存储。
# 本仓库里不留任何会员内容；日志是公开的，所以脚本用 PUBLIC_LOG 只输出进度数字，不输出句子。
# 需要的 Secret：MAIN_REPO_TOKEN（已有）、SUPABASE_SERVICE_ROLE_KEY（Settings → Secrets and variables → Actions 里添加）。
# 在 Actions 页面手动运行。mode 可以写几个，用空格分开。已经生成过的会跳过，可以反复运行；换了声音（主仓库 gen_audio.py 和本仓库 ja/voice.json）会重新生成。
name: Member audio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: ja-course / ja-listen / ja-biz / ja-read / ja-ex / anime-daily / zh / en（可以写几个，空格分开）
        required: true
        default: 'zh en'
      ref:
        description: 从 nihonggo-dojo 的哪个分支取脚本
        required: false
        default: wip-en

permissions:
  contents: read

env:
  MODES: ${{ inputs.mode }}
  SUPABASE_URL: https://tpwljbzjixdggqjsgltf.supabase.co
  PUBLIC_LOG: '1'
  # 出错时的报错信息也可能带句子：带非 ASCII 字符或引号的行一律隐藏
  REDACT: |
    import sys
    for l in sys.stdin: print(l.rstrip() if l.isascii() and "'" not in l and '"' not in l else '  (detail hidden)', flush=True)

jobs:
  # 日语：课程、听力、动漫每日一课在一台机器上跑（课程整段合成要全部句子）
  ja:
    if: ${{ contains(inputs.mode, 'ja-course') || contains(inputs.mode, 'ja-listen') || contains(inputs.mode, 'anime-daily') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: member-audio-ja
      cancel-in-progress: false
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koshokai/nihonggo-dojo
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          ref: ${{ inputs.ref }}
          path: src
          sparse-checkout: tools
      # 网站上已经有的录音（跳过不重复生成）和当前声音：读本仓库 ja/ 下的索引
      - uses: actions/checkout@v4
        with:
          path: pub
          sparse-checkout: |
            ja/*.json
          sparse-checkout-cone-mode: false
      - name: Tools
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
      - name: Generate & upload
        working-directory: src
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JA_AUDIO_DIR: ${{ github.workspace }}/pub/ja
          JA_SHARD: ${{ matrix.shard && format('{0}/8', matrix.shard) || '0/1' }}
          PARTIAL_DIR: ${{ github.workspace }}/partial
          WHICH: ${{ matrix.shard && 'shard' || 'solo' }}
        shell: bash -o pipefail {0}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "没有设置 SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          for M in $MODES; do
            case "$WHICH:$M" in
              solo:ja-course|solo:ja-listen|solo:anime-daily|shard:ja-biz|shard:ja-read|shard:ja-ex|shard:ja-grammar)
                python3 tools/gen_member_audio.py $M 2>&1 | python3 -u -c "$REDACT";;
            esac
          done
      - if: ${{ matrix.shard != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.shard }}
          path: partial
          if-no-files-found: ignore
          retention-days: 3

  # 日语：阅读、商务、例句（数量多）分 8 台同时生成，最后合并索引
  ja-shard:
    if: ${{ contains(inputs.mode, 'ja-biz') || contains(inputs.mode, 'ja-read') || contains(inputs.mode, 'ja-ex') || contains(inputs.mode, 'ja-grammar') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ['0', '1', '2', '3', '4', '5', '6', '7']
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koshokai/nihonggo-dojo
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          ref: ${{ inputs.ref }}
          path: src
          sparse-checkout: tools
      # 网站上已经有的录音（跳过不重复生成）和当前声音：读本仓库 ja/ 下的索引
      - uses: actions/checkout@v4
        with:
          path: pub
          sparse-checkout: |
            ja/*.json
          sparse-checkout-cone-mode: false
      - name: Tools
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
      - name: Generate & upload
        working-directory: src
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JA_AUDIO_DIR: ${{ github.workspace }}/pub/ja
          JA_SHARD: ${{ matrix.shard && format('{0}/8', matrix.shard) || '0/1' }}
          PARTIAL_DIR: ${{ github.workspace }}/partial
          WHICH: ${{ matrix.shard && 'shard' || 'solo' }}
        shell: bash -o pipefail {0}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "没有设置 SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          for M in $MODES; do
            case "$WHICH:$M" in
              solo:ja-course|solo:ja-listen|solo:anime-daily|shard:ja-biz|shard:ja-read|shard:ja-ex|shard:ja-grammar)
                python3 tools/gen_member_audio.py $M 2>&1 | python3 -u -c "$REDACT";;
            esac
          done
      - if: ${{ matrix.shard != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.shard }}
          path: partial
          if-no-files-found: ignore
          retention-days: 3

  ja-merge:
    needs: ja-shard
    if: ${{ always() && needs.ja-shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    concurrency:
      group: member-audio-ja-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koshokai/nihonggo-dojo
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          ref: ${{ inputs.ref }}
          path: src
          sparse-checkout: tools
      - uses: actions/checkout@v4
        with:
          path: pub
          sparse-checkout: |
            ja/*.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partial
      - name: Merge indexes
        working-directory: src
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JA_AUDIO_DIR: ${{ github.workspace }}/pub/ja
          MEMBER_MERGE: ${{ github.workspace }}/partial
        shell: bash -o pipefail {0}
        run: |
          ls "$MEMBER_MERGE"
          for M in $MODES; do case "$M" in ja-biz|ja-read|ja-ex|ja-grammar) python3 tools/gen_member_audio.py $M 2>&1 | python3 -u -c "$REDACT";; esac; done

  zh:
    if: ${{ contains(format(' {0} ', inputs.mode), ' zh ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: member-audio-zh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koshokai/nihonggo-dojo
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          ref: ${{ inputs.ref }}
          path: src
          sparse-checkout: |
            tools
            lang
            audio/index-zh.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install MeloTTS
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          git clone -q --depth 1 https://github.com/myshell-ai/MeloTTS /tmp/MeloTTS
          pip install -q -e /tmp/MeloTTS
          python -m unidic download
          python -c "import nltk; nltk.download('averaged_perceptron_tagger_eng', quiet=True); nltk.download('cmudict', quiet=True)"
      - name: Generate & upload
        working-directory: src
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash -o pipefail {0}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "没有设置 SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          python3 tools/gen_member_audio.py zh 2>&1 | python3 -u -c "$REDACT"

  en:
    if: ${{ contains(format(' {0} ', inputs.mode), ' en ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: member-audio-en
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: koshokai/nihonggo-dojo
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          ref: ${{ inputs.ref }}
          path: src
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro
        run: |
          sudo apt-get update -q && sudo apt-get install -yq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile numpy
      - name: Generate & upload
        working-directory: src
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash -o pipefail {0}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "没有设置 SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          python3 tools/gen_member_audio.py en 2>&1 | python3 -u -c "$REDACT"

# 宣传动画的英语配音（Kokoro, af_heart）：读 promo/lines-en.json，生成 promo/voice-en/*.wav，提交回本仓库。
name: Promo voice (English)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [promo/lines-en.json, promo/voice_en.py]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: promo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -yq espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile numpy
      - name: Generate
        run: python3 promo/voice_en.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo/voice-en
          git diff --cached --quiet || { git commit -qm "promo: English voice (Kokoro)" && git pull -q --rebase && git push -q; }

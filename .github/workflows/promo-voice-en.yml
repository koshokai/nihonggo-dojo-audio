# 宣传动画的英语配音（Kokoro, af_heart）：读 promo/lines-en.json，生成 promo/voice-en/*.wav，提交回本仓库。
name: Promo voice (English)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [promo/lines-en.json, promo/lines-en2.json]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: promo
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -yq espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile numpy
      - name: Generate
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q lines-en.json; then python3 promo/voice_en.py; fi
          python3 promo/voice_en.py promo/lines-en2.json promo/voice-en2 af_bella 1.1
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo/voice-en promo/voice-en2
          git diff --cached --quiet || { git commit -qm "promo: English voice (Kokoro)" && git pull -q --rebase && git push -q; }
